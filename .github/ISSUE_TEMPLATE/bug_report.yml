name: Bug report
description: Report something that does not work as expected
title: "fix: "
labels: [bug]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ./program with ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Error messages, crash output, valgrind report...
      render: shell

  - type: input
    id: commit
    attributes:
      label: Commit or branch
      placeholder: develop, a1b2c3d...
